workflows:
  ios-verify:
    name: HMONG X iOS - kiem tra build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Build iOS (khong ky - chi kiem tra bien dich)
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - ios/App/build/Build/Products/**/*.app

  # ─────────────────────────────────────────────────────────────────────────
  # NOP APP STORE — ky code + xuat .ipa + day len TestFlight/App Store Connect
  #
  # Trang thai 15/08/2026:
  #   ✅ Tai khoan Apple Developer ACTIVE — Team ID A4XPMY5ZB8
  #   ✅ App da tao tren App Store Connect — Apple ID 6801789131, bundle com.hmongx.app
  #   ✅ App Store Connect API key da tao — Issuer 9bbbab4e-b125-455c-8c24-727bcf0b74dd,
  #      Key ID 8484N8P7UM (file .p8 giu o may Aib, KHONG dua vao repo)
  #   ⏳ Con lai: tren Codemagic → Teams → Integrations → App Store Connect,
  #      them key tren voi TEN DUNG LA:  hmongx-asc  (workflow goi dung ten nay)
  # ─────────────────────────────────────────────────────────────────────────
  ios-appstore:
    name: HMONG X iOS - NOP APP STORE
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: hmongx-asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      # ⚠️ KHONG dung khoi "ios_signing" o day.
      # Khoi do bat Codemagic di TIM provisioning profile CO SAN truoc khi chay script,
      # tai khoan moi thi chua co profile nao → build chet ngay voi loi
      # "No matching profiles found for bundle identifier ... and distribution type app_store"
      # (dinh that 15/08/2026, build #1).
      # Thay vao do de buoc "Lay chung chi + profile ky code" ben duoi tu TAO bang --create.
      vars:
        BUNDLE_ID: "com.hmongx.app"
        APP_STORE_APPLE_ID: "6801789131"   # Apple ID cua app tren App Store Connect (tao 15/08/2026)
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Lay chung chi + profile ky code (tu TAO neu chua co)
        script: |
          set -e
          keychain initialize

          # Build #2 va #3 chet o day:
          #   #2 "Cannot save Signing Certificates without certificate private key"
          #   #3 "Cannot create resource without certificate private key"
          # Ly do: tai khoan Apple moi CHUA co distribution certificate, va lenh
          # app-store-connect KHONG tu sinh khoa RSA — no doi minh dua khoa vao
          # de ky yeu cau tao chung chi (CSR).
          # => Sinh khoa RSA ngay tai day roi truyen vao ca 2 lenh.
          # ⚠️ SUA 22/08/2026 — MOI BUILD DE MOT CHUNG CHI MOI.
          # Truoc day khoa RSA sinh vao /tmp, ma may Codemagic sach sau moi lan chay
          # => moi build tao them 1 distribution certificate trong tai khoan Apple.
          # Apple chi cho vai cai. Build 1.0(1) va 1.0(2) da dot khoang 2 cai roi.
          #
          # Cach dung DUNG: Aib tu sinh khoa MOT LAN roi dan vao bien moi truong
          # ma hoa CERTIFICATE_PRIVATE_KEY tren Codemagic (Claude khong dan credential ho).
          #   ssh-keygen -t rsa -b 2048 -m PEM -f hmongx_cert_key -q -N ""
          #   -> mo file hmongx_cert_key, copy TOAN BO noi dung, dan vao Codemagic
          #      (Environment variables, group ios_signing, tick Secure)
          # Khi da co bien do thi khong tao them chung chi nao nua.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Dung khoa co dinh tu bien moi truong — KHONG tao them chung chi."
            echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/hmongx_cert_key
            chmod 600 /tmp/hmongx_cert_key
          else
            echo "!!! CANH BAO: chua co CERTIFICATE_PRIVATE_KEY — build nay se DE THEM 1 CHUNG CHI."
            echo "!!! Xem huong dan ngay tren trong codemagic.yaml de dan khoa co dinh."
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/hmongx_cert_key -q -N ""
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --certificate-key=@file:/tmp/hmongx_cert_key \
              --save || true
          fi

          # Lay/tao provisioning profile cho bundle id
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/hmongx_cert_key \
            --create

          keychain add-certificates
          xcode-project use-profiles
      - name: Danh so ban dung (build number) tang dan
        script: |
          BN=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($BN + 1))
        working_directory: ios/App
      - name: Build va xuat .ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/Build/Products/**/*.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration
        # BAT DAU bang TestFlight thoi — KHONG tu gui duyet ban public.
        # Chay ngon roi, doi submit_to_app_store: true khi muon nop that.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hmong4svn@gmail.com
        notify:
          success: true
          failure: true

  android-apk:
    name: HMONG X Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Build APK (debug - cai thang duoc, khong can ky)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Day APK len may chu de co link tai
        script: |
          # Codemagic doi dang nhap moi cho tai artifact, nen chinh may build day thang
          # file sang VPS. Cua nhan ben do co ma bao ve va se bi xoa sau khi lay xong.
          APK=$(find android -name "*.apk" | head -1)
          echo "day len: $APK"
          curl -s -X POST https://hmongx.com/api/tam-nhan-apk \
            -H "x-ma: adc5522ea5c8ba580d618b17bf861907" \
            --data-binary "@$APK" | head -c 200
          echo ""

    artifacts:
      - android/app/build/outputs/**/*.apk

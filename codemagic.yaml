# codemagic.yaml — DUAB ZOO iOS
# Sao từ ~/hmong-x-ios/codemagic.yaml (bản đã đưa HMONG X lên App Store 26/08/2026),
# chỉ đổi tên app + bundle id. CƠ CHẾ KÝ CODE GIỮ NGUYÊN — đừng "cải tiến".
workflows:
  ios-verify:
    name: DUAB ZOO iOS - kiem tra build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Build iOS (khong ky - chi kiem tra bien dich)
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - ios/App/build/Build/Products/**/*.app

  # ─────────────────────────────────────────────────────────────────────────
  # NOP APP STORE — ky code + xuat .ipa + day len TestFlight/App Store Connect
  #
  # Trang thai 04/09/2026 (DUAB ZOO):
  #   ✅ Tai khoan Apple Developer ACTIVE — Team ID A4XPMY5ZB8 (dung chung voi HMONG X)
  #   ✅ App Store Connect API key da co tu HMONG X — Issuer 9bbbab4e-b125-455c-8c24-727bcf0b74dd,
  #      Key ID 8484N8P7UM, integration tren Codemagic ten `hmongx-asc` (dung chung duoc,
  #      key nay la cua ca team, khong rieng app nao)
  #   ⏳ AIB PHAI LAM: tao app record tren App Store Connect voi bundle com.hmongx.duabzoo
  #      → lay "Apple ID" cua app (so 10 chu so) dien vao APP_STORE_APPLE_ID ben duoi.
  #   ⏳ AIB PHAI LAM: dan CERTIFICATE_PRIVATE_KEY (khoa RSA co dinh) vao Codemagic
  #      → xem huong dan ngay trong buoc "Lay chung chi + profile ky code".
  # ─────────────────────────────────────────────────────────────────────────
  ios-appstore:
    name: DUAB ZOO iOS - NOP APP STORE
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: hmongx-asc
    environment:
      # 05/09 thẩm định: KHÔNG khai groups thì $CERTIFICATE_PRIVATE_KEY KHÔNG BAO GIỜ được bơm vào máy build
      #   (Codemagic chỉ nạp biến của group được tham chiếu) ⇒ bước ký exit 1. HMONG X vì thiếu dòng này mà
      #   rơi vào nhánh sinh khoá mới, đốt hết 3 chứng chỉ. Tên group phải ĐÚNG tên Aib tạo trên Codemagic.
      groups:
        - ios_signing
      node: 22
      xcode: latest
      cocoapods: default
      # ⚠️ KHONG dung khoi "ios_signing" o day.
      # Khoi do bat Codemagic di TIM provisioning profile CO SAN truoc khi chay script,
      # bundle moi (com.hmongx.duabzoo) thi chua co profile nao → build chet ngay voi loi
      # "No matching profiles found for bundle identifier ... and distribution type app_store"
      # (HMONG X dinh that 15/08/2026, build #1).
      # Thay vao do de buoc "Lay chung chi + profile ky code" ben duoi tu TAO bang --create.
      vars:
        BUNDLE_ID: "com.hmongx.duabzoo"
        # Apple ID cua app DUAB ZOO tren App Store Connect.
        # ĐIỀN SAU KHI TẠO APP TRÊN ASC (App Store Connect → Apps → DUAB ZOO → App Information → Apple ID).
        # De trong thi buoc "Danh so ban dung" tu roi ve build number 1.
        APP_STORE_APPLE_ID: "0"   # "0" = chua co app tren ASC (Codemagic khong cho de trong); thay bang Apple ID 10 so khi da tao app
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Lay chung chi + profile ky code (KHOA CO DINH — bat buoc)
        script: |
          set -e
          keychain initialize

          # ⚠️ BAI HOC TU HMONG X (22/08/2026): moi build sinh khoa RSA moi vao /tmp
          # ⇒ moi build de them 1 distribution certificate trong tai khoan Apple.
          # Apple chi cho toi da 3 chung chi IOS_DISTRIBUTION — HMONG X DA CHAM TRAN.
          # ⇒ Voi DUAB ZOO BAT BUOC dung khoa co dinh, KHONG co nhanh du phong sinh khoa moi.
          #
          # Cach lam (Aib lam MOT LAN, dung chung cho moi app cua team A4XPMY5ZB8):
          #   Dung DUNG khoa hmongx_cert_key da dan cho HMONG X (cung khoa ⇒ cung chung chi,
          #   khong ton them slot). Neu chua co thi:
          #     ssh-keygen -t rsa -b 2048 -m PEM -f hmongx_cert_key -q -N ""
          #   -> mo file hmongx_cert_key, copy TOAN BO noi dung, dan vao Codemagic
          #      (Teams → Environment variables: ten CERTIFICATE_PRIVATE_KEY, group ios_signing, tick Secure)
          #   -> trong workflow nay, o phan environment them:  groups: [ios_signing]  (neu Codemagic doi)
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "!!! DUNG: chua co bien CERTIFICATE_PRIVATE_KEY."
            echo "!!! Tran 3 chung chi distribution cua Apple da cham — KHONG duoc tao them."
            echo "!!! Dan khoa co dinh vao Codemagic (huong dan ngay tren) roi build lai."
            exit 1
          fi
          echo "Dung khoa co dinh tu bien moi truong — KHONG tao them chung chi."
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/hmongx_cert_key
          chmod 600 /tmp/hmongx_cert_key

          # Lay/tao provisioning profile cho bundle id (profile thi tao thoai mai, khong co tran)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/hmongx_cert_key \
            --create

          keychain add-certificates
          xcode-project use-profiles
      - name: Danh so ban dung (build number) tang dan
        script: |
          if [ -z "$APP_STORE_APPLE_ID" ]; then
            echo "APP_STORE_APPLE_ID trong — chua tao app tren ASC? Dung build number 1."
            BN=0
          else
            BN=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          fi
          agvtool new-version -all $(($BN + 1))
        working_directory: ios/App
      - name: Build va xuat .ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/Build/Products/**/*.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration
        # BAT DAU bang TestFlight thoi — KHONG tu gui duyet ban public.
        # Chay ngon roi, doi submit_to_app_store: true khi muon nop that.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hmong4svn@gmail.com
        notify:
          success: true
          failure: true

workflows:
  ios-verify:
    name: HMONG X iOS - kiem tra build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Build iOS (khong ky - chi kiem tra bien dich)
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - ios/App/build/Build/Products/**/*.app

  # ─────────────────────────────────────────────────────────────────────────
  # NOP APP STORE — ky code + xuat .ipa + day len TestFlight/App Store Connect
  #
  # Trang thai 15/08/2026:
  #   ✅ Tai khoan Apple Developer ACTIVE — Team ID A4XPMY5ZB8
  #   ✅ App da tao tren App Store Connect — Apple ID 6801789131, bundle com.hmongx.app
  #   ✅ App Store Connect API key da tao — Issuer 9bbbab4e-b125-455c-8c24-727bcf0b74dd,
  #      Key ID 8484N8P7UM (file .p8 giu o may Aib, KHONG dua vao repo)
  #   ⏳ Con lai: tren Codemagic → Teams → Integrations → App Store Connect,
  #      them key tren voi TEN DUNG LA:  hmongx-asc  (workflow goi dung ten nay)
  # ─────────────────────────────────────────────────────────────────────────
  ios-appstore:
    name: HMONG X iOS - NOP APP STORE
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: hmongx-asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      # ⚠️ KHONG dung khoi "ios_signing" o day.
      # Khoi do bat Codemagic di TIM provisioning profile CO SAN truoc khi chay script,
      # tai khoan moi thi chua co profile nao → build chet ngay voi loi
      # "No matching profiles found for bundle identifier ... and distribution type app_store"
      # (dinh that 15/08/2026, build #1).
      # Thay vao do de buoc "Lay chung chi + profile ky code" ben duoi tu TAO bang --create.
      vars:
        BUNDLE_ID: "com.hmongx.app"
        APP_STORE_APPLE_ID: "6801789131"   # Apple ID cua app tren App Store Connect (tao 15/08/2026)
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Lay chung chi + profile ky code (tu TAO neu chua co)
        script: |
          set -e
          keychain initialize

          # Build #2 chet o day: "Cannot save Signing Certificates without certificate private key".
          # Ly do: tai khoan Apple moi tinh CHUA co distribution certificate nao, ma lenh
          # fetch-signing-files chi biet DI LAY chung chi co san — no khong tu sinh private key.
          # => Phai tao chung chi truoc. Lenh duoi TU SINH private key va luu lai.
          # "|| true" de lan build sau (da co chung chi roi) khong bi dung.
          app-store-connect certificates create --type IOS_DISTRIBUTION --save || true

          # Gio moi lay/tao provisioning profile cho bundle id
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates
          xcode-project use-profiles
      - name: Danh so ban dung (build number) tang dan
        script: |
          BN=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($BN + 1))
        working_directory: ios/App
      - name: Build va xuat .ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/Build/Products/**/*.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration
        # BAT DAU bang TestFlight thoi — KHONG tu gui duyet ban public.
        # Chay ngon roi, doi submit_to_app_store: true khi muon nop that.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hmong4svn@gmail.com
        notify:
          success: true
          failure: true

  android-apk:
    name: HMONG X Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Build APK (debug - cai thang duoc, khong can ky)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

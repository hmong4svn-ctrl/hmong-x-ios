workflows:
  ios-verify:
    name: HMONG X iOS - kiem tra build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Build iOS (khong ky - chi kiem tra bien dich)
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - ios/App/build/Build/Products/**/*.app

  android-apk:
    name: HMONG X Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Cai dat npm
        script: npm install
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Build APK (debug - cai thang duoc, khong can ky)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
